<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
 <title>Consolidador de Requisições</title>
  <link href="../../css/bootstrap.min.css" rel="stylesheet" />
  <script src="../../js/sweetalert2.min.js"></script>
  <script src="../../js/bootstrap.min.js"></script>
  <script src="../../js/pdf.min.js"></script>
  <script src="../../js/xlsx.full.min.js"></script>
  <script src="../../js/tesseract.min.js"></script>
<style>
    .drop-area {
      border: 2px dashed #0d6efd;
      border-radius: 10px;
      padding: 40px;
      text-align: center;
      background: #f8fbff;
      cursor: pointer;
      transition: .2s;
    }
    .drop-area:hover {
      background: #eef5ff;
    }
  </style>
</head>

<body class="bg-light">

<div class="container py-4">
  <div class="card shadow-sm">
    <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
      <h5 class="mb-0">Consolidador de PDF - Requisições de Serviço/Compra</h5>
      <span id="badgeArquivos" class="badge bg-light text-primary">0 PDFs carregados</span>
    </div>

    <div class="card-body">
      <div class="row mb-3 align-items-center">
        <div class="col-md-7">
          <button id="limpar" class="btn btn-outline-danger btn-sm">
            Limpar Tudo
          </button>
          <small class="text-muted ms-2">
            Você pode arrastar vários PDFs de uma vez ou adicionar aos poucos.
          </small>
        </div>

        <div class="col-md-5 text-end">
          <button id="exportar" class="btn btn-success" disabled>
            Exportar Tabela Única (Excel)
          </button>
        </div>
      </div>

      <div id="drop" class="drop-area">
        <h5 class="text-primary">Arraste os PDFs de Requisição aqui</h5>
        <p class="text-muted mb-0">ou clique para selecionar múltiplos arquivos</p>
        <input type="file" id="fileInput" hidden accept=".pdf" multiple>
      </div>

      <div id="listaArquivos" class="mt-3 d-flex flex-wrap gap-2"></div>

      <hr>

      <div id="status" class="alert alert-secondary mt-3">
        Aguardando arquivos...
      </div>

      <div class="table-responsive mt-3">
        <table class="table table-striped table-bordered table-sm align-middle">
          <thead class="table-dark">
            <tr>
              <th class="text-center" style="width: 60px;">Item</th>
              <th>Descrição</th>
              <th class="text-center" style="width: 70px;">Unid.</th>
              <th class="text-end" style="width: 100px;">Quant.</th>
              <th class="text-end" style="width: 130px;">Valor Unit.</th>
              <th class="text-end" style="width: 140px;">Valor Total</th>
            </tr>
          </thead>
          <tbody id="preview"></tbody>
          <tfoot id="tabelaRodape" class="table-secondary fw-bold"></tfoot>
        </table>
      </div>
    </div>
  </div>
</div>

</body>

<script src="requisicoes.js?v=2"></script>
<script src="../../them2e.js"></script>
</html>
