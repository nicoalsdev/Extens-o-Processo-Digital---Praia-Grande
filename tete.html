<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="css/bootstrap.min.css" rel="stylesheet">
	<title></title>
</head>
<style>
  .before,
  .after {
    margin: 0;
  }

  .before figcaption,
  .after figcaption {
    background: #fff;
    border: 1px solid #c0c0c0;
    border-radius: 12px;
    color: #2e3452;
    opacity: 0.8;
    padding: 12px;
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    line-height: 100%;
  }

  .before figcaption {
    left: 12px;
  }

  .after figcaption {
    right: 12px;
  }
</style>
<body>




<img-comparison-slider style='max-width: 700px;'>
<figure slot="first" class="before">
    <img width="100%" src="tutorial/before.png">
    <figcaption>Antes</figcaption>
  </figure>
  <figure slot="second" class="after">
    <img width="100%" src="tutorial/after.png">
    <figcaption>Depois</figcaption>
  </figure>
</img-comparison-slider>



</body>

<script
  defer
  src="js/img-comparison-slider.js"
></script>
<link
  rel="stylesheet"
  href="css/img-comparison-slider.css"
/>
<script src="js/bootstrap.min.js"></script>
</html>
