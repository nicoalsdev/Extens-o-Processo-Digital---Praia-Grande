<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gerenciador de Backup Seletivo</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background: var(--bg); color: var(--text); margin: 0; padding: 24px; }
    .container { max-width: 1100px; margin: 0 auto; }

    header {
      display: flex; justify-content: space-between; align-items: center;
      flex-wrap: wrap; gap: 16px; margin-bottom: 24px;
      padding-bottom: 16px; border-bottom: 1px solid var(--border);
    }

    h1 { margin: 0; font-size: 1.5rem; }
    .subtitle { color: var(--muted); font-size: 0.9rem; margin-top: 4px; }

    .actions { display: flex; gap: 10px; flex-wrap: wrap; }
    button, .file-label {
      background: var(--card); color: var(--text); border: 1px solid var(--border);
      padding: 10px 16px; border-radius: 8px; cursor: pointer; font-weight: 600;
      font-size: 0.9rem; transition: 0.2s; display: inline-flex; align-items: center; gap: 6px;
    }
    button:hover, .file-label:hover { border-color: var(--primary); }
    button.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
    button.primary:hover { background: var(--primary-hover); }
    button.success { background: var(--success); border-color: var(--success); color: #052e16; }

    .stats-bar {
      display: flex; justify-content: space-between; align-items: center;
      background: var(--card); padding: 12px 16px; border-radius: 8px;
      border: 1px solid var(--border); margin-bottom: 20px; font-size: 0.9rem;
    }

    .group {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 10px; margin-bottom: 20px; overflow: hidden;
    }

    .group-header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 14px 18px; background: rgba(15, 23, 42, 0.5);
      border-bottom: 1px solid var(--border);
    }

    .group-title { font-weight: 700; display: flex; align-items: center; gap: 10px; }
    .badge {
      font-size: 0.75rem; padding: 2px 8px; border-radius: 999px;
      background: #334155; color: #e2e8f0;
    }

    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 12px 18px; text-align: left; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); font-size: 0.8rem; text-transform: uppercase; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(255, 255, 255, 0.02); }

    .key-name { font-family: monospace; font-size: 0.95rem; color: #38bdf8; word-break: break-all; }
    .preview {
      font-family: monospace; font-size: 0.8rem; color: var(--muted);
      max-width: 450px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .size { font-family: monospace; font-size: 0.85rem; white-space: nowrap; }

    .btn-inspect {
      padding: 4px 10px; font-size: 0.8rem; border-radius: 6px;
    }

    /* Modal de inspeção JSON */
    dialog {
      background: var(--card); color: var(--text); border: 1px solid var(--border);
      border-radius: 12px; width: 90%; max-width: 800px; padding: 20px;
    }
    dialog::backdrop { background: rgba(0, 0, 0, 0.7); }
    pre {
      background: var(--bg); padding: 16px; border-radius: 8px;
      max-height: 60vh; overflow: auto; font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1>Backup & Restauração Seletiva</h1>
        <div class="subtitle">Varredura completa de Storage, Cache e dados locais da extensão</div>
      </div>
      <div class="actions">
        <button id="btn-refresh">Atualizar Lista</button>
        <button id="btn-select-all">Marcar Todos</button>
        <button id="btn-deselect-all">Desmarcar Todos</button>
        <label class="file-label">
          Importar Backup (.json)
          <input type="file" id="input-import" accept=".json" hidden />
        </label>
        <button id="btn-export" class="primary">Exportar Selecionados</button>
      </div>
    </header>

    <div class="stats-bar">
      <span id="summary-count">Carregando registros...</span>
      <span id="summary-size">Tamanho selecionado: 0 KB</span>
    </div>

    <div id="groups-container"></div>
  </div>

  <dialog id="modal-inspect">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
      <strong id="modal-title" style="font-family:monospace; color:#38bdf8;"></strong>
      <button id="btn-close-modal">Fechar</button>
    </div>
    <pre id="modal-content"></pre>
  </dialog>
<script src="backup_manager.js"></script>
  <script src="backup.js"></script>
</body>
</html>
